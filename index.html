<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank2OFX Pro - Enterprise Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.260.0/lucide.min.css" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .drop-active { border-color: #4f46e5; background-color: #f5f3ff; transform: scale(1.01); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .mapping-active-date { border-bottom: 4px solid #6366f1 !important; background-color: #eef2ff !important; }
        .mapping-active-debit { border-bottom: 4px solid #f43f5e !important; background-color: #fff1f2 !important; }
        .mapping-active-credit { border-bottom: 4px solid #10b981 !important; background-color: #ecfdf5 !important; }
        .mapping-active-desc { border-bottom: 4px solid #f59e0b !important; background-color: #fffbeb !important; }
        
        .editable-cell { transition: all 0.1s; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .editable-cell:hover { background-color: #f8fafc; cursor: text; box-shadow: inset 0 0 0 2px #6366f1; }
        .editable-cell:focus { outline: none; background-color: white; box-shadow: inset 0 0 0 2px #4f46e5; z-index: 10; white-space: normal; overflow: visible; }
        
        .duplicate-row { background-color: #fff7ed !important; border-left: 4px solid #f97316 !important; }
        
        #toast {
            position: fixed; bottom: 2rem; right: 2rem; z-index: 100;
            transform: translateY(200%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #toast.visible { transform: translateY(0); }
    </style>
</head>

<body class="bg-[#f8fafc] min-h-screen text-slate-900 pb-12">
    <div id="toast" class="bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3">
        <div class="bg-indigo-500 rounded-full p-1"><i data-lucide="info" class="w-4 h-4"></i></div>
        <span id="toastMsg" class="text-sm font-bold">Action Successful</span>
    </div>

    <div class="max-w-[1800px] mx-auto p-4 md:p-6">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg">
                    <i data-lucide="shield-check" class="text-white w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-slate-900">Bank2OFX <span class="text-indigo-600">Enterprise</span></h1>
                </div>
            </div>
            <div id="confidenceBadge" class="hidden">
                <div class="bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest border border-emerald-200">
                    <i data-lucide="check-circle-2" class="inline w-3 h-3 mr-1"></i> Data Parsed
                </div>
            </div>
        </header>

        <div id="mainContainer" class="space-y-6">
            <!-- Settings Bar -->
            <div id="settingsPanel" class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm transition-all duration-500">
                <div id="settingsGrid" class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-6 gap-6 items-end">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Bank ID</label>
                        <input type="text" id="bankId" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Account #</label>
                        <input type="text" id="accountId" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Filter: From</label>
                        <input type="date" id="startDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Filter: To</label>
                        <input type="date" id="endDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none">
                    </div>
                    <div class="flex flex-col gap-2 pb-1">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="skipHeader" checked class="w-4 h-4 text-indigo-600 rounded">
                            <label for="skipHeader" class="text-[10px] font-bold text-slate-600">Skip Header</label>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="invertAmounts" class="w-4 h-4 text-indigo-600 rounded">
                            <label for="invertAmounts" class="text-[10px] font-bold text-slate-600">Invert Signs</label>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2 pb-1">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="excludeDupes" class="w-4 h-4 text-orange-600 rounded">
                            <label for="excludeDupes" class="text-[10px] font-bold text-slate-600">No Dupes</label>
                        </div>
                        <button onclick="saveSettings()" class="text-[10px] font-black text-indigo-600 uppercase tracking-widest hover:text-indigo-800 transition-colors">Save Defaults</button>
                    </div>
                </div>
            </div>

            <main>
                <!-- Upload Zone -->
                <section id="uploadSection" class="py-12">
                    <input type="file" id="fileInput" accept=".csv, .xls, .xlsx, .pdf" class="hidden">
                    <div id="dropZone" class="bg-white border-2 border-dashed border-slate-200 rounded-[3rem] p-32 text-center hover:border-indigo-400 hover:bg-indigo-50/20 transition-all cursor-pointer group shadow-sm">
                        <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="upload-cloud" class="w-10 h-10"></i>
                        </div>
                        <h2 class="text-3xl font-black text-slate-800 mb-2">Import Statement</h2>
                        <p class="text-slate-500 mb-8 max-w-md mx-auto">Drop your CSV, Excel, or PDF bank statement here.</p>
                        <button class="bg-indigo-600 text-white px-10 py-4 rounded-xl font-bold shadow-xl">Select File</button>
                    </div>
                </section>

                <!-- Processing State -->
                <div id="loadingState" class="hidden py-32 text-center">
                    <div class="w-12 h-12 border-4 border-slate-100 border-t-indigo-600 rounded-full animate-spin mx-auto mb-4"></div>
                    <h3 class="text-xl font-bold text-slate-800">Processing Ledger...</h3>
                </div>

                <!-- Preview Table -->
                <section id="previewContainer" class="hidden space-y-4">
                    <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
                        <div class="px-8 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                            <div class="flex gap-8">
                                <div class="flex flex-col">
                                    <span class="text-[9px] font-black text-slate-400 uppercase">Batch Rows</span>
                                    <span id="rowCount" class="text-lg font-black text-slate-800">0</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[9px] font-black text-rose-400 uppercase">Total Out</span>
                                    <span id="sumDebit" class="text-lg font-black text-rose-600">$0.00</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[9px] font-black text-emerald-400 uppercase">Total In</span>
                                    <span id="sumCredit" class="text-lg font-black text-emerald-600">$0.00</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[9px] font-black text-indigo-400 uppercase">Net Delta</span>
                                    <span id="sumNet" class="text-lg font-black text-indigo-600">$0.00</span>
                                </div>
                            </div>
                            <div class="flex gap-3">
                                <button id="cancelBtn" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-rose-500">Discard</button>
                                <button id="convertBtn" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-black shadow-lg hover:bg-indigo-700 transition-all flex items-center gap-2">
                                    <i data-lucide="zap" class="w-4 h-4"></i> GENERATE OFX
                                </button>
                            </div>
                        </div>

                        <div class="overflow-x-auto custom-scrollbar max-h-[70vh]">
                            <table class="w-full text-sm text-left border-collapse table-fixed">
                                <thead class="bg-white sticky top-0 z-30 shadow-sm">
                                    <tr id="tableHead"></tr>
                                </thead>
                                <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- Result View -->
                <section id="resultContainer" class="hidden py-12 text-center">
                    <div class="bg-white rounded-[3rem] p-16 shadow-2xl border border-slate-100 max-w-xl mx-auto">
                        <div class="w-20 h-20 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="check" class="w-10 h-10"></i>
                        </div>
                        <h2 class="text-3xl font-black text-slate-900 mb-6">Conversion Ready</h2>
                        <button id="downloadBtn" class="bg-indigo-600 text-white w-full py-6 rounded-2xl font-black text-xl shadow-xl hover:bg-indigo-700 mb-6 flex items-center justify-center gap-3">
                            <i data-lucide="download"></i> Save .OFX File
                        </button>
                        <button id="restartBtn" class="text-slate-400 font-bold text-xs uppercase tracking-widest hover:text-indigo-600">Start Over</button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        let state = {
            rawData: [],
            mapping: { date: -1, debit: -1, credit: -1, desc: -1 },
            ofxContent: "",
            duplicates: new Set(),
            startDate: null,
            endDate: null,
            visibleCols: []
        };

        const els = {
            fileInput: document.getElementById('fileInput'),
            dropZone: document.getElementById('dropZone'),
            uploadSection: document.getElementById('uploadSection'),
            loadingState: document.getElementById('loadingState'),
            previewContainer: document.getElementById('previewContainer'),
            resultContainer: document.getElementById('resultContainer'),
            tableHead: document.getElementById('tableHead'),
            tableBody: document.getElementById('tableBody'),
            rowCount: document.getElementById('rowCount'),
            convertBtn: document.getElementById('convertBtn'),
            downloadBtn: document.getElementById('downloadBtn'),
            skipHeader: document.getElementById('skipHeader'),
            invertAmounts: document.getElementById('invertAmounts'),
            excludeDupes: document.getElementById('excludeDupes'),
            sumNet: document.getElementById('sumNet'),
            sumDebit: document.getElementById('sumDebit'),
            sumCredit: document.getElementById('sumCredit'),
            confidenceBadge: document.getElementById('confidenceBadge'),
            startDate: document.getElementById('startDate'),
            endDate: document.getElementById('endDate'),
            bankId: document.getElementById('bankId'),
            accountId: document.getElementById('accountId'),
            toast: document.getElementById('toast'),
            toastMsg: document.getElementById('toastMsg'),
            cancelBtn: document.getElementById('cancelBtn'),
            restartBtn: document.getElementById('restartBtn')
        };

        const updateIcons = () => lucide.createIcons();
        const showToast = (msg) => {
            els.toastMsg.innerText = msg;
            els.toast.classList.add('visible');
            setTimeout(() => els.toast.classList.remove('visible'), 3000);
        };

        window.onload = () => {
            updateIcons();
            els.bankId.value = localStorage.getItem('bank2ofx_bankid') || '123456789';
            els.accountId.value = localStorage.getItem('bank2ofx_account') || '987654321';
        };

        function saveSettings() {
            localStorage.setItem('bank2ofx_bankid', els.bankId.value);
            localStorage.setItem('bank2ofx_account', els.accountId.value);
            showToast("System Configuration Saved");
        }

        els.dropZone.onclick = () => els.fileInput.click();
        els.fileInput.onchange = (e) => handleFiles(e.target.files);
        els.dropZone.ondragover = (e) => { e.preventDefault(); els.dropZone.classList.add('drop-active'); };
        els.dropZone.ondragleave = () => els.dropZone.classList.remove('drop-active');
        els.dropZone.ondrop = (e) => { e.preventDefault(); els.dropZone.classList.remove('drop-active'); handleFiles(e.dataTransfer.files); };

        const parseInputDate = (val) => {
            if (!val) return null;
            const [y, m, d] = val.split('-');
            return new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
        };

        els.startDate.onchange = (e) => { state.startDate = parseInputDate(e.target.value); renderTable(); };
        els.endDate.onchange = (e) => { state.endDate = parseInputDate(e.target.value); renderTable(); };
        els.invertAmounts.onchange = () => renderTable();
        els.excludeDupes.onchange = () => renderTable();
        els.cancelBtn.onclick = els.restartBtn.onclick = () => location.reload();

        async function handleFiles(files) {
            if (!files[0]) return;
            els.uploadSection.classList.add('hidden');
            els.loadingState.classList.remove('hidden');

            try {
                const ext = files[0].name.split('.').pop().toLowerCase();
                if (ext === 'pdf') await parsePDF(files[0]);
                else await parseExcel(files[0]);

                autoDetectVisibleColumns(); 
                autoDetectMapping();
                applyDynamicDateLimits();
                renderTable();

                els.loadingState.classList.add('hidden');
                els.previewContainer.classList.remove('hidden');
                els.confidenceBadge.classList.remove('hidden');
                updateIcons();
            } catch (err) {
                alert("Processing failed: " + err.message);
                location.reload();
            }
        }

        async function parseExcel(file) {
            const data = await file.arrayBuffer();
            const wb = XLSX.read(data, { type: 'array', cellDates: true });
            state.rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
        }

        async function parsePDF(file) {
            const data = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data }).promise;
            let matrix = [];
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const text = await page.getTextContent();
                let rows = {};
                text.items.forEach(it => {
                    const y = Math.round(it.transform[5]);
                    if (!rows[y]) rows[y] = [];
                    rows[y].push({ x: it.transform[4], t: it.str });
                });
                Object.keys(rows).sort((a, b) => b - a).forEach(y => {
                    const row = rows[y].sort((a, b) => a.x - b.x).map(it => it.t.trim());
                    if (row.join('').length > 0) matrix.push(row);
                });
            }
            state.rawData = matrix;
        }

        function autoDetectVisibleColumns() {
            const maxCols = state.rawData.reduce((a, b) => Math.max(a, b.length), 0);
            state.visibleCols = [];
            for (let c = 0; c < maxCols; c++) {
                let hasData = false;
                for (let r = 0; r < state.rawData.length; r++) {
                    const val = state.rawData[r][c];
                    if (val !== undefined && val !== null && String(val).trim() !== "") {
                        hasData = true;
                        break;
                    }
                }
                if (hasData) state.visibleCols.push(c);
            }
        }

        function autoDetectMapping() {
            state.mapping = { date: -1, debit: -1, credit: -1, desc: -1 };
            const keywords = {
                date: ['date', 'posted', 'trans date', 'fecha'],
                debit: ['debit', 'withdrawal', 'amount out', 'paid out', 'payment', 'charge', 'cargo', 'retiro'],
                credit: ['credit', 'deposit', 'amount in', 'paid in', 'received', 'abono'],
                desc: ['desc', 'particulars', 'trans', 'memo', 'narrative', 'payee', 'details', 'concepto', 'referencia']
            };

            state.rawData.slice(0, 10).forEach((row, rowIdx) => {
                row.forEach((cell, colIdx) => {
                    const val = String(cell).toLowerCase().trim();
                    if (!val) return;
                    if (state.mapping.date === -1 && keywords.date.some(k => val.includes(k))) state.mapping.date = colIdx;
                    if (state.mapping.debit === -1 && keywords.debit.some(k => val.includes(k))) state.mapping.debit = colIdx;
                    if (state.mapping.credit === -1 && keywords.credit.some(k => val.includes(k))) state.mapping.credit = colIdx;
                    if (state.mapping.desc === -1 && keywords.desc.some(k => val.includes(k))) state.mapping.desc = colIdx;
                });
            });
        }

        function applyDynamicDateLimits() {
            let dates = [];
            state.rawData.forEach(row => {
                const d = robustParseDate(row[state.mapping.date]);
                if (d) dates.push(d);
            });
            if (dates.length > 0) {
                const min = new Date(Math.min(...dates));
                const max = new Date(Math.max(...dates));
                const formatDate = (d) => d.toISOString().split('T')[0];
                els.startDate.value = formatDate(min);
                els.endDate.value = formatDate(max);
                state.startDate = min;
                state.endDate = max;
            }
        }

        function detectDuplicates() {
            state.duplicates = new Set();
            const seen = new Map();
            state.rawData.forEach((row, idx) => {
                if (els.skipHeader.checked && idx === 0) return;
                const key = `${row[state.mapping.date]}_${row[state.mapping.debit]}_${row[state.mapping.credit]}_${row[state.mapping.desc]}`;
                if (seen.has(key)) {
                    state.duplicates.add(idx);
                    state.duplicates.add(seen.get(key));
                } else {
                    seen.set(key, idx);
                }
            });
        }

        function renderTable() {
            els.tableHead.innerHTML = "";
            els.tableBody.innerHTML = "";
            detectDuplicates();

            let totalD = 0, totalC = 0, validCount = 0;

            state.visibleCols.forEach(i => {
                const th = document.createElement('th');
                th.className = "p-3 border-r border-slate-200 bg-slate-50 w-[200px]";
                const isD = state.mapping.date === i, isDeb = state.mapping.debit === i, isC = state.mapping.credit === i, isDe = state.mapping.desc === i;
                if (isD) th.classList.add('mapping-active-date');
                if (isDeb) th.classList.add('mapping-active-debit');
                if (isC) th.classList.add('mapping-active-credit');
                if (isDe) th.classList.add('mapping-active-desc');

                th.innerHTML = `
                    <div class="flex flex-col gap-1.5">
                        <span class="text-[8px] font-black uppercase text-slate-400">Col ${i + 1}</span>
                        <div class="flex flex-wrap gap-1">
                            <button onclick="setMap('date', ${i})" class="px-1.5 py-0.5 rounded text-[9px] font-bold ${isD ? 'bg-indigo-600 text-white' : 'bg-white border text-slate-400'}">DATE</button>
                            <button onclick="setMap('debit', ${i})" class="px-1.5 py-0.5 rounded text-[9px] font-bold ${isDeb ? 'bg-rose-600 text-white' : 'bg-white border text-slate-400'}">OUT</button>
                            <button onclick="setMap('credit', ${i})" class="px-1.5 py-0.5 rounded text-[9px] font-bold ${isC ? 'bg-emerald-600 text-white' : 'bg-white border text-slate-400'}">IN</button>
                            <button onclick="setMap('desc', ${i})" class="px-1.5 py-0.5 rounded text-[9px] font-bold ${isDe ? 'bg-amber-500 text-white' : 'bg-white border text-slate-400'}">DESC</button>
                        </div>
                    </div>`;
                els.tableHead.appendChild(th);
            });

            state.rawData.forEach((row, rowIdx) => {
                if (els.skipHeader.checked && rowIdx === 0) return;
                
                const dateObj = robustParseDate(row[state.mapping.date]);
                if (dateObj) {
                    const rowDate = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
                    if (state.startDate && rowDate < state.startDate) return;
                    if (state.endDate && rowDate > state.endDate) return;
                }

                if (els.excludeDupes.checked && state.duplicates.has(rowIdx)) return;

                validCount++;
                const inv = els.invertAmounts.checked ? -1 : 1;
                totalD += Math.abs(cleanAmount(row[state.mapping.debit]) * inv);
                totalC += Math.abs(cleanAmount(row[state.mapping.credit]) * inv);

                const tr = document.createElement('tr');
                if (state.duplicates.has(rowIdx)) tr.classList.add('duplicate-row');

                state.visibleCols.forEach(colIdx => {
                    const cell = row[colIdx];
                    const td = document.createElement('td');
                    td.className = "p-2 border-r border-slate-100 text-slate-600 editable-cell font-medium text-xs";
                    let v = cell || "";
                    td.innerText = v instanceof Date ? v.toLocaleDateString() : v;

                    if (colIdx === state.mapping.debit && v && cleanAmount(v) !== 0) td.innerHTML = `<span class="text-rose-600 font-bold">${td.innerText}</span>`;
                    if (colIdx === state.mapping.credit && v && cleanAmount(v) !== 0) td.innerHTML = `<span class="text-emerald-600 font-bold">${td.innerText}</span>`;

                    td.contentEditable = "true";
                    td.onblur = () => { state.rawData[rowIdx][colIdx] = td.innerText; renderTable(); };
                    tr.appendChild(td);
                });
                els.tableBody.appendChild(tr);
            });

            els.rowCount.innerText = validCount;
            els.sumDebit.innerText = `-$${totalD.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
            els.sumCredit.innerText = `$${totalC.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
            els.sumNet.innerText = `${(totalC - totalD >= 0 ? '' : '-')}$${Math.abs(totalC - totalD).toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
            updateIcons();
        }

        window.setMap = (type, idx) => { state.mapping[type] = idx; renderTable(); };
        els.skipHeader.onchange = () => renderTable();

        function robustParseDate(val) {
            if (!val) return null;
            if (val instanceof Date) return val;
            let s = String(val).trim();
            
            // Support "DD MM YYYY" specifically
            let parts = s.split(/[\/\-\. ]+/);
            if (parts.length === 3) {
                let d = parseInt(parts[0]), m = parseInt(parts[1]), y = parseInt(parts[2]);
                if (y < 100) y += 2000;
                // Basic validation
                if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
                    return new Date(y, m - 1, d);
                }
            }
            
            const res = new Date(s);
            return isNaN(res) ? null : res;
        }

        function cleanAmount(val) {
            if (!val) return 0;
            const cleaned = String(val).replace(/[^\d.-]/g, '');
            const num = parseFloat(cleaned);
            return isNaN(num) ? 0 : num;
        }

        els.convertBtn.onclick = () => {
            let txns = "", count = 0, minD = "99999999", maxD = "00000000";
            const now = new Date();
            const ts = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}${String(now.getSeconds()).padStart(2, '0')}`;

            state.rawData.forEach((row, idx) => {
                if (els.skipHeader.checked && idx === 0) return;
                
                const dateObj = robustParseDate(row[state.mapping.date]);
                if (dateObj) {
                    const rowDate = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
                    if (state.startDate && rowDate < state.startDate) return;
                    if (state.endDate && rowDate > state.endDate) return;
                } else return; // Skip if no valid date

                if (els.excludeDupes.checked && state.duplicates.has(idx)) return;

                const inv = els.invertAmounts.checked ? -1 : 1;
                const amt = (cleanAmount(row[state.mapping.credit]) - Math.abs(cleanAmount(row[state.mapping.debit]))) * inv;
                
                if (amt !== 0) {
                    const yyyymmdd = `${dateObj.getFullYear()}${String(dateObj.getMonth() + 1).padStart(2, '0')}${String(dateObj.getDate()).padStart(2, '0')}`;
                    if (yyyymmdd < minD) minD = yyyymmdd;
                    if (yyyymmdd > maxD) maxD = yyyymmdd;
                    const desc = String(row[state.mapping.desc] || "Transaction").substring(0, 32).replace(/[&<]/g, '').trim();
                    txns += `<STMTTRN>\r\n<TRNTYPE>${amt >= 0 ? 'DEP' : 'XFER'}</TRNTYPE>\r\n<DTPOSTED>${yyyymmdd}120000</DTPOSTED>\r\n<TRNAMT>${amt.toFixed(2)}</TRNAMT>\r\n<FITID>${yyyymmdd}${Math.abs(amt).toFixed(0)}${idx}</FITID>\r\n<NAME>${desc}</NAME>\r\n</STMTTRN>\r\n`;
                    count++;
                }
            });

            if (count === 0) return showToast("No exportable data found for selected range");

            state.ofxContent = `OFXHEADER:100\r\nDATA:OFXSGML\r\nVERSION:102\r\nSECURITY:NONE\r\nENCODING:USASCII\r\nCHARSET:1252\r\nCOMPRESSION:NONE\r\n\r\n<OFX>\r\n<SIGNONMSGSRSV1>\r\n<SONRS>\r\n<STATUS><CODE>0</CODE><SEVERITY>INFO</SEVERITY></STATUS>\r\n<DTSERVER>${ts}</DTSERVER>\r\n<LANGUAGE>ENG</LANGUAGE>\r\n<FI><ORG>Bank</ORG><FID>12345</FID></FI>\r\n</SONRS>\r\n</SIGNONMSGSRSV1>\r\n<BANKMSGSRSV1>\r\n<STMTTRNRS>\r\n<TRNUID>${ts}</TRNUID>\r\n<STATUS><CODE>0</CODE><SEVERITY>INFO</SEVERITY></STATUS>\r\n<STMTRS>\r\n<CURDEF>USD</CURDEF>\r\n<BANKACCTFROM>\r\n<BANKID>${els.bankId.value || '123456789'}</BANKID>\r\n<ACCTID>${els.accountId.value || '987654321'}</ACCTID>\r\n<ACCTTYPE>CHECKING</ACCTTYPE>\r\n</BANKACCTFROM>\r\n<BANKTRANLIST>\r\n<DTSTART>${minD}120000</DTSTART>\r\n<DTEND>${maxD}120000</DTEND>\r\n${txns}</BANKTRANLIST>\r\n<LEDGERBAL>\r\n<BALAMT>0.00</BALAMT>\r\n<DTASOF>${ts}</DTASOF>\r\n</LEDGERBAL>\r\n</STMTRS>\r\n</STMTTRNRS>\r\n</BANKMSGSRSV1>\r\n</OFX>`;

            els.previewContainer.classList.add('hidden');
            els.resultContainer.classList.remove('hidden');
            updateIcons();
        };

        els.downloadBtn.onclick = () => {
            const blob = new Blob([state.ofxContent], { type: 'application/x-ofx' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Export_${new Date().getTime()}.ofx`;
            a.click();
            showToast("OFX File Downloaded");
        };
    </script>
</body>
</html>
